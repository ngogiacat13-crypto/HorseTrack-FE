name: check

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Nhánh main không chứa tài liệu nội bộ
        if: github.ref == 'refs/heads/main'
        run: |
          found=$(grep -v '^[[:space:]]*$' .github/main-exclude.txt | tr -d '\r' | xargs -r git ls-files --)
          if [ -n "$found" ]; then
            echo "::error::Các file nội bộ không được nằm trên main (gộp bằng npm run merge:main):"
            echo "$found"
            exit 1
          fi
      - name: Nhánh dev giữ đủ tài liệu nội bộ (không gộp main vào dev)
        if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'
        run: |
          missing=""
          for f in $(grep -v '^[[:space:]]*$' .github/main-exclude.txt | tr -d '\r'); do
            [ -n "$(git ls-files -- "$f")" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::Dev bị mất file nội bộ (thường do gộp main vào dev):$missing"
            echo "Khôi phục: git checkout <commit-trước-khi-gộp> -- <file>. Chiều gộp đúng là dev -> main bằng npm run merge:main."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run scenarios
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
